name: PR impact tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch or commit to compare against (defaults to origin/main)
        required: false
        type: string
      head_ref:
        description: Head branch or commit to analyze (defaults to this workflow run)
        required: false
        type: string

permissions:
  contents: read

jobs:
  impact:
    name: Index and analyze PayFlow changes
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: pr_impact
      REPO_ID: payflow-demo
      AGENT_REF: f16149b6055a23dd9e501a6b4023f42927a84843

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Atlas credentials
        run: |
          if [[ -z "$MONGODB_URI" ]]; then
            echo "MONGODB_URI is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PayFlow test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install PR Impact Agent
        run: python -m pip install "git+https://github.com/xIshanSandhux/mongodb-hackathon.git@${AGENT_REF}"

      - name: Resolve comparison commits
        id: commits
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_HEAD_REF: ${{ inputs.head_ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
            head_ref="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base_ref="$RUN_SHA"
            head_ref="$RUN_SHA"
          else
            base_ref="${INPUT_BASE_REF:-origin/main}"
            head_ref="${INPUT_HEAD_REF:-$RUN_SHA}"
          fi

          base_sha="$(git rev-parse "$base_ref^{commit}")"
          head_sha="$(git rev-parse "$head_ref^{commit}")"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Comparing $base_sha to $head_sha"

      - name: Index base snapshot in MongoDB Atlas
        run: >-
          impact-agent index --repo "$GITHUB_WORKSPACE" --repo-id "$REPO_ID"
          --commit "${{ steps.commits.outputs.base_sha }}"

      - name: Analyze changes and run selected tests
        if: github.event_name != 'push'
        id: analyze
        shell: bash
        env:
          BASE_SHA: ${{ steps.commits.outputs.base_sha }}
          HEAD_SHA: ${{ steps.commits.outputs.head_sha }}
        run: |
          set +e
          impact-agent analyze \
            --repo "$GITHUB_WORKSPACE" \
            --repo-id "$REPO_ID" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output impact-report.json \
            --summary impact-summary.md
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish test selection summary
        if: always()
        run: |
          if [[ -f impact-summary.md ]]; then
            cat impact-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The impact agent did not produce a summary. Check the earlier workflow logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payflow-impact-report
          path: impact-report.json
          if-no-files-found: warn

      - name: Set check result from test outcome
        if: always() && steps.analyze.outcome == 'success'
        env:
          ANALYZE_EXIT_CODE: ${{ steps.analyze.outputs.exit_code }}
        run: |
          if [[ "$ANALYZE_EXIT_CODE" != "0" ]]; then
            echo "The impact agent or selected tests failed (exit code: ${ANALYZE_EXIT_CODE:-missing})."
            exit 1
          fi
